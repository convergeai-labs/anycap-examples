<svg xmlns="http://www.w3.org/2000/svg" width="1376" height="768" viewBox="0 0 1376 768">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#F6A91A"/>
    </marker>
    <style>
      .box { fill: #19C7F3; rx: 14; }
      .lbl { fill: #FFFFFF; font-family: -apple-system, "Helvetica Neue", sans-serif; font-size: 22px; font-weight: 600; text-anchor: middle; }
      .edge { stroke: #F6A91A; stroke-width: 5; fill: none; marker-end: url(#arr); }
    </style>
  </defs>
  <rect width="1376" height="768" rx="28" fill="#0B0B12"/>

  <!-- top -->
  <rect class="box" x="548" y="64" width="280" height="72" rx="14"/>
  <text class="lbl" x="688" y="109">Next.js Web</text>

  <!-- middle -->
  <rect class="box" x="208" y="296" width="220" height="72" rx="14"/>
  <text class="lbl" x="318" y="341">FastAPI</text>
  <rect class="box" x="578" y="296" width="220" height="72" rx="14"/>
  <text class="lbl" x="688" y="341">Worker</text>
  <rect class="box" x="948" y="296" width="220" height="72" rx="14"/>
  <text class="lbl" x="1058" y="341">Redis Queue</text>

  <!-- bottom -->
  <rect class="box" x="98" y="560" width="260" height="72" rx="14"/>
  <text class="lbl" x="228" y="605">Postgres pgvector</text>
  <rect class="box" x="428" y="560" width="220" height="72" rx="14"/>
  <text class="lbl" x="538" y="605">S3 Storage</text>
  <rect class="box" x="718" y="560" width="200" height="72" rx="14"/>
  <text class="lbl" x="818" y="605">LLM API</text>
  <rect class="box" x="988" y="560" width="240" height="72" rx="14"/>
  <text class="lbl" x="1108" y="605">Embedding API</text>

  <!-- edges -->
  <path class="edge" d="M 620 136 L 620 250 L 360 250 L 360 292"/>            <!-- Web -> FastAPI -->
  <path class="edge" d="M 428 332 L 574 332"/>                                <!-- FastAPI -> Worker -->
  <path class="edge" d="M 798 332 L 944 332"/>                                <!-- Worker -> Redis Queue -->
  <path class="edge" d="M 300 368 L 300 480 L 520 480 L 520 556"/>            <!-- FastAPI -> S3 -->
  <path class="edge" d="M 340 368 L 340 510 L 800 510 L 800 556"/>            <!-- FastAPI -> LLM -->
  <path class="edge" d="M 688 368 L 688 440 L 228 440 L 228 556"/>            <!-- Worker -> Postgres -->
  <path class="edge" d="M 740 368 L 740 470 L 1080 470 L 1080 556"/>          <!-- Worker -> Embedding -->
</svg>
